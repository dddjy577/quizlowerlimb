<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Limb Anatomy Quiz By Oben</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Hot Pink Primary Accent */
            --primary: #FF69B4; /* Hot Pink */
            --secondary: #E65A9F; /* Darker Pink for hover state */

            /* Black Backgrounds and Gray Card */
            --bg-pure-black: #000000; /* ABSOLUTELY PURE BLACK */
            --card-dark-gray: #111111; /* Very Dark Gray Card Background for contrast */
            
            /* General Palette */
            --text: #ffffff; /* White text */
            --text-secondary: #9ca3af; /* Light Gray secondary text */
            --success: #84cc16; /* Lime Green for correct */
            --error: #f87171; /* Light Red for error */
            --border: #374151; /* Medium Gray border */
        }

        /* Set HTML and BODY to pure black to ensure the whole viewport is covered */
        html {
            background-color: var(--bg-pure-black);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-pure-black); /* PURE BLACK */
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-dark-gray); /* Dark Gray for main card */
            width: 100%;
            max-width: 650px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.9); /* Deep shadow */
            margin-top: 20px;
            min-height: 500px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: var(--primary); /* Hot Pink Title */
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .stat {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .stat strong {
            color: var(--text);
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--bg-pure-black); /* PURE BLACK for inner question card */
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            border: 1px solid var(--border);
            text-align: center;
        }

        .question-text {
            color: var(--primary); /* Hot Pink Question Text */
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
            width: 100%;
        }

        .option-btn {
            background-color: var(--card-dark-gray);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--secondary);
            border-color: var(--primary);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-correct {
            background-color: var(--success);
            color: var(--bg-pure-black);
            font-weight: 700;
            border-color: var(--success);
        }

        .option-wrong {
            background-color: var(--error);
            color: var(--bg-pure-black);
            font-weight: 700;
            border-color: var(--error);
        }

        .feedback-area {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .feedback-correct {
            background-color: rgba(132, 204, 22, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .feedback-wrong {
            background-color: rgba(248, 113, 113, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .mode-btn, .action-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
            width: 100%;
        }
        
        .mode-btn {
            background-color: var(--primary); /* Hot Pink Button */
            color: var(--bg-pure-black);
        }
        .mode-btn:hover {
            background-color: var(--secondary); /* Darker Pink Hover */
            color: var(--text);
        }

        /* Styles for next/end quiz buttons in the flow */
        .quiz-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        #next-btn {
            background-color: var(--primary); /* Hot Pink Button */
            color: var(--bg-pure-black);
        }
        #next-btn:hover {
            background-color: var(--secondary); /* Darker Pink Hover */
            color: var(--text);
        }
        
        #end-quiz-btn {
            background-color: var(--border);
            color: var(--text);
        }
        #end-quiz-btn:hover {
            background-color: var(--text-secondary);
        }

        .results-container {
            text-align: center;
            padding: 30px;
        }

        .results-container h2 {
            font-size: 2rem;
            color: var(--primary); /* Hot Pink Title */
            margin-bottom: 15px;
        }
        
        .final-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--success); /* Keeping the success color for score result */
            margin-bottom: 20px;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin-top: 50px;
        }
        .mode-selection button {
            font-size: 1.25rem;
            padding: 16px 30px;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Lower Limb Anatomy Quiz By Oben</h1>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h2 class="text-xl font-semibold mb-8 text-center" style="color:var(--primary);">Select Quiz Mode</h2>
        <div class="mode-selection">
            <button class="mode-btn" onclick="startQuiz(true)">Random</button>
            <button class="mode-btn" onclick="startQuiz(false)">Ordered</button>
        </div>
    </div>
    <!-- END START SCREEN -->


    <div id="quiz-container" style="display:none;">
        <div class="header-controls">
            <div class="stat">Score: <strong id="score">0</strong></div>
            <div class="stat">Question: <strong id="question-count">0</strong> / <strong id="total-questions">?</strong></div>
        </div>
        
        <div class="question-card">
            <p id="current-muscle" class="text-lg font-normal text-white mb-2"></p>
            <p id="question-text" class="question-text">Loading Question...</p>
        </div>

        <div id="options-container" class="options-grid">
            <!-- Options will be dynamically inserted here -->
        </div>

        <div id="feedback-area" class="feedback-area" style="display:none;">
            <!-- Feedback will be inserted here -->
        </div>
        
        <div class="quiz-actions">
            <button id="next-btn" class="action-btn" onclick="nextQuestion()" style="display:none;">Next Question</button>
            <button id="end-quiz-btn" class="action-btn" onclick="endQuiz()" style="display:none;">End Quiz & Review Results</button>
        </div>
    </div>

    <div id="results-container" class="results-container" style="display:none;">
        <h2>Quiz Complete!</h2>
        <p class="text-xl text-gray-400">Your Final Score:</p>
        <div id="final-score" class="final-score"></div>
        <p class="text-sm text-gray-400">You got <strong id="final-correct">0</strong> correct out of <strong id="final-total">0</strong> questions.</p>
        <button class="mode-btn" onclick="window.location.reload()">Start Over</button>
    </div>
</div>

<script>
    // --- QUIZ DATA ---
    const muscleData = [
        // Anterior Thigh
        { 'Muscle Name': 'm. iliacus', 'Origin': 'fossa iliaca', 'Insertion': 'trochanter minor', 'Function': 'flexion, external rotation', 'Nerve': 'n. femoralis', 'Artery': 'a. femorale circumflexus mediale' },
        { 'Muscle Name': 'm. psoas major', 'Origin': 'vertebrae T12-L5', 'Insertion': 'trochanter minor', 'Function': 'flexion, external rotation', 'Nerve': 'rr. musculares from plexus lumbalis', 'Artery': 'rami lumbales' },
        { 'Muscle Name': 'm. sartorius', 'Origin': 'spina iliaca anterior superior', 'Insertion': 'tibia (pes anserinus)', 'Function': 'flexion, external rotation, abduction', 'Nerve': 'n. femoralis', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. quadriceps femoris (rectus femoris)', 'Origin': 'spina iliaca anterior inferior', 'Insertion': 'patella, tuberositas tibiae', 'Function': 'extension, flexion (hip)', 'Nerve': 'n. femoralis', 'Artery': 'a. femoris circumflexus lateralis' },
        { 'Muscle Name': 'm. quadriceps femoris (vastus lateralis)', 'Origin': 'linea aspera (lateral lip)', 'Insertion': 'patella, tuberositas tibiae', 'Function': 'extension', 'Nerve': 'n. femoralis', 'Artery': 'a. femoris circumflexus lateralis' },
        { 'Muscle Name': 'm. quadriceps femoris (vastus medialis)', 'Origin': 'linea aspera (medial lip)', 'Insertion': 'patella, tuberositas tibiae', 'Function': 'extension', 'Nerve': 'n. femoralis', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. quadriceps femoris (vastus intermedius)', 'Origin': 'facies anterior femoris', 'Insertion': 'patella, tuberositas tibiae', 'Function': 'extension', 'Nerve': 'n. femoralis', 'Artery': 'a. femoris profunda' },
        // Medial Thigh
        { 'Muscle Name': 'm. pectineus', 'Origin': 'pecten ossis pubis', 'Insertion': 'linea aspera (pectineal line)', 'Function': 'adduction, flexion', 'Nerve': 'n. femoralis (sometimes n. obturatorius)', 'Artery': 'a. obturatoria, a. femoris profunda' },
        { 'Muscle Name': 'm. gracilis', 'Origin': 'ramus inferior ossis pubis', 'Insertion': 'tibia (pes anserinus)', 'Function': 'adduction, flexion (knee), internal rotation', 'Nerve': 'n. obturatorius', 'Artery': 'a. obturatoria' },
        { 'Muscle Name': 'm. adductor longus', 'Origin': 'corpus ossis pubis', 'Insertion': 'linea aspera (middle third)', 'Function': 'adduction, flexion', 'Nerve': 'n. obturatorius', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. adductor brevis', 'Origin': 'ramus inferior ossis pubis', 'Insertion': 'linea aspera (upper third)', 'Function': 'adduction, flexion', 'Nerve': 'n. obturatorius', 'Artery': 'a. obturatoria, a. femoris profunda' },
        { 'Muscle Name': 'm. adductor magnus', 'Origin': 'tuber ischiadicum, ramus inferior ossis pubis', 'Insertion': 'linea aspera, tuberculum adductorium', 'Function': 'adduction, extension, internal rotation', 'Nerve': 'n. obturatorius, n. ischiadicus (tibial part)', 'Artery': 'a. femoris profunda' },
        // Gluteal Region (Superficial)
        { 'Muscle Name': 'm. gluteus maximus', 'Origin': 'facies glutealis ilii, os sacrum, os coccygis', 'Insertion': 'tractus iliotibialis, tuberositas glutealis', 'Function': 'extension, external rotation', 'Nerve': 'n. gluteus inferior', 'Artery': 'a. glutea superior et inferior' },
        { 'Muscle Name': 'm. gluteus medius', 'Origin': 'facies glutealis ilii', 'Insertion': 'trochanter major', 'Function': 'abduction, internal rotation', 'Nerve': 'n. gluteus superior', 'Artery': 'a. glutea superior' },
        { 'Muscle Name': 'm. gluteus minimus', 'Origin': 'facies glutealis ilii', 'Insertion': 'trochanter major', 'Function': 'abduction, internal rotation', 'Nerve': 'n. gluteus superior', 'Artery': 'a. glutea superior' },
        { 'Muscle Name': 'm. tensor fasciae latae', 'Origin': 'spina iliaca anterior superior', 'Insertion': 'tractus iliotibialis', 'Function': 'abduction, flexion, internal rotation', 'Nerve': 'n. gluteus superior', 'Artery': 'a. femoris circumflexus lateralis' },
        // Gluteal Region (Deep)
        { 'Muscle Name': 'm. piriformis', 'Origin': 'facies pelvica ossis sacri', 'Insertion': 'trochanter major', 'Function': 'external rotation, abduction', 'Nerve': 'rr. musculares from plexus sacralis', 'Artery': 'a. glutea superior et inferior' },
        { 'Muscle Name': 'm. obturator internus', 'Origin': 'facies interna membranae obturatoriae', 'Insertion': 'trochanter major', 'Function': 'external rotation, abduction', 'Nerve': 'n. obturatorius internus', 'Artery': 'a. obturatoria' },
        { 'Muscle Name': 'm. quadratus femoris', 'Origin': 'tuber ischiadicum', 'Insertion': 'crista intertrochanterica', 'Function': 'external rotation, adduction', 'Nerve': 'n. quadratus femoris', 'Artery': 'a. femoris circumflexus medialis' },
        // Posterior Thigh (Hamstrings)
        { 'Muscle Name': 'm. biceps femoris (caput longum)', 'Origin': 'tuber ischiadicum', 'Insertion': 'caput fibulae', 'Function': 'flexion (knee), extension (hip), external rotation', 'Nerve': 'n. ischiadicus (tibial part)', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. biceps femoris (caput breve)', 'Origin': 'linea aspera (lateral lip)', 'Insertion': 'caput fibulae', 'Function': 'flexion (knee), external rotation', 'Nerve': 'n. fibularis communis', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. semitendinosus', 'Origin': 'tuber ischiadicum', 'Insertion': 'tibia (pes anserinus)', 'Function': 'flexion (knee), extension (hip), internal rotation', 'Nerve': 'n. ischiadicus (tibial part)', 'Artery': 'a. femoris profunda' },
        { 'Muscle Name': 'm. semimembranosus', 'Origin': 'tuber ischiadicum', 'Insertion': 'condylus medialis tibiae', 'Function': 'flexion (knee), extension (hip), internal rotation', 'Nerve': 'n. ischiadicus (tibial part)', 'Artery': 'a. femoris profunda' },
        // Anterior Leg
        { 'Muscle Name': 'm. tibialis anterior', 'Origin': 'facies lateralis tibiae', 'Insertion': 'os cuneiforme mediale, os metatarsale I', 'Function': 'dorsiflexion, inversion', 'Nerve': 'n. fibularis profundus', 'Artery': 'a. tibialis anterior' },
        { 'Muscle Name': 'm. extensor digitorum longus', 'Origin': 'condylus lateralis tibiae, membrana interossea', 'Insertion': 'phalanges mediae et distales 2-5', 'Function': 'dorsiflexion, toe extension', 'Nerve': 'n. fibularis profundus', 'Artery': 'a. tibialis anterior' },
        { 'Muscle Name': 'm. extensor hallucis longus', 'Origin': 'facies medialis fibulae, membrana interossea', 'Insertion': 'phalanx distalis hallucis', 'Function': 'dorsiflexion, great toe extension', 'Nerve': 'n. fibularis profundus', 'Artery': 'a. tibialis anterior' },
        // Lateral Leg
        { 'Muscle Name': 'm. fibularis longus', 'Origin': 'caput fibulae', 'Insertion': 'os cuneiforme mediale, os metatarsale I', 'Function': 'plantarflexion, eversion', 'Nerve': 'n. fibularis superficialis', 'Artery': 'a. fibularis' },
        { 'Muscle Name': 'm. fibularis brevis', 'Origin': 'facies lateralis fibulae', 'Insertion': 'tuberositas ossis metatarsalis V', 'Function': 'plantarflexion, eversion', 'Nerve': 'n. fibularis superficialis', 'Artery': 'a. fibularis' },
        // Posterior Leg (Superficial)
        { 'Muscle Name': 'm. triceps surae (gastrocnemius caput mediale)', 'Origin': 'condylus medialis femoris', 'Insertion': 'tuber calcanei (tendo calcaneus)', 'Function': 'plantarflexion, flexion (knee)', 'Nerve': 'n. tibialis', 'Artery': 'a. poplitea' },
        { 'Muscle Name': 'm. triceps surae (gastrocnemius caput laterale)', 'Origin': 'condylus lateralis femoris', 'Insertion': 'tuber calcanei (tendo calcaneus)', 'Function': 'plantarflexion, flexion (knee)', 'Nerve': 'n. tibialis', 'Artery': 'a. poplitea' },
        { 'Muscle Name': 'm. soleus', 'Origin': 'caput fibulae, linea musculi solei tibiae', 'Insertion': 'tuber calcanei (tendo calcaneus)', 'Function': 'plantarflexion', 'Nerve': 'n. tibialis', 'Artery': 'a. tibialis posterior' },
        { 'Muscle Name': 'm. plantaris', 'Origin': 'epicondylus lateralis femoris', 'Insertion': 'tuber calcanei', 'Function': 'plantarflexion, flexion (knee)', 'Nerve': 'n. tibialis', 'Artery': 'a. poplitea' },
        // Posterior Leg (Deep)
        { 'Muscle Name': 'm. popliteus', 'Origin': 'epicondylus lateralis femoris', 'Insertion': 'facies posterior tibiae', 'Function': 'internal rotation, flexion (knee)', 'Nerve': 'n. tibialis', 'Artery': 'a. poplitea' },
        { 'Muscle Name': 'm. flexor hallucis longus', 'Origin': 'facies posterior fibulae', 'Insertion': 'phalanx distalis hallucis', 'Function': 'plantarflexion, toe flexion', 'Nerve': 'n. tibialis', 'Artery': 'a. tibialis posterior' },
        { 'Muscle Name': 'm. flexor digitorum longus', 'Origin': 'facies posterior tibiae', 'Insertion': 'phalanges distales 2-5', 'Function': 'plantarflexion, toe flexion', 'Nerve': 'n. tibialis', 'Artery': 'a. tibialis posterior' },
        { 'Muscle Name': 'm. tibialis posterior', 'Origin': 'membrana interossea, facies posterior tibiae et fibulae', 'Insertion': 'ossa tarsalia et metatarsalia II-IV', 'Function': 'plantarflexion, inversion', 'Nerve': 'n. tibialis', 'Artery': 'a. tibialis posterior' }
    ];

    // Global state variables for quiz
    let score = 0;
    let questionsAnswered = 0;
    let currentQuestion = null;
    let isRandomMode = true; // True for Random, False for Ordered

    // Ordered Mode State
    let orderedMuscleIndex = 0;
    let orderedPropertyIndex = 0;
    // Keys to cycle through for the Ordered mode
    const propertyKeys = ['Origin', 'Insertion', 'Function', 'Nerve', 'Artery'];
    const totalQuestionsInOrderedMode = muscleData.length * propertyKeys.length;

    // Element references
    const quizContainer = document.getElementById('quiz-container');
    const startScreen = document.getElementById('start-screen');
    const resultsContainer = document.getElementById('results-container');
    const scoreEl = document.getElementById('score');
    const questionCountEl = document.getElementById('question-count');
    const totalQuestionsEl = document.getElementById('total-questions');
    const currentMuscleEl = document.getElementById('current-muscle');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackEl = document.getElementById('feedback-area');
    const nextBtn = document.getElementById('next-btn');
    const endQuizBtn = document.getElementById('end-quiz-btn'); 

    // --- Core Quiz Functions ---

    /**
     * Corrected Fisher-Yates shuffle algorithm.
     */
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            // Correct element swap using destructuring assignment
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(randomMode) {
        isRandomMode = randomMode;
        
        startScreen.style.display = 'none';
        quizContainer.style.display = 'block';

        // Ensure End Quiz button is hidden at the start of any quiz
        endQuizBtn.style.display = 'none';

        // Set total questions display
        if (isRandomMode) {
            totalQuestionsEl.innerText = '∞';
        } else {
            totalQuestionsEl.innerText = totalQuestionsInOrderedMode;
        }

        // Reset state for new quiz
        score = 0;
        questionsAnswered = 0;
        orderedMuscleIndex = 0;
        orderedPropertyIndex = 0;
        scoreEl.innerText = score;
        questionCountEl.innerText = 0; // Display 0 answered initially

        generateQuestion();
    }

    function generateQuestion() {
        optionsContainer.innerHTML = '';
        feedbackEl.style.display = 'none';
        nextBtn.style.display = 'none';
        endQuizBtn.style.display = 'none'; 

        let currentMuscle;
        let currentPropertyKey;

        // --- Mode Logic ---
        if (isRandomMode) {
            // RANDOM MODE: Pick a random muscle and a random property
            currentMuscle = muscleData[Math.floor(Math.random() * muscleData.length)];
            currentPropertyKey = propertyKeys[Math.floor(Math.random() * propertyKeys.length)];
        } else {
            // ORDERED MODE: Check for end of quiz
            if (orderedMuscleIndex >= muscleData.length) {
                // If we hit the end of the muscle list, ensure endQuiz is called immediately
                endQuiz();
                return;
            }
            // Use current muscle and current property in sequence
            currentMuscle = muscleData[orderedMuscleIndex];
            currentPropertyKey = propertyKeys[orderedPropertyIndex];
        }
        
        const correctAnswer = currentMuscle[currentPropertyKey];
        const correctMuscleName = currentMuscle['Muscle Name'];

        // Construct question object
        currentQuestion = {
            muscle: correctMuscleName,
            type: currentPropertyKey,
            correct: correctAnswer,
        };

        // --- Question Display ---
        currentMuscleEl.innerText = `Muscle: ${correctMuscleName}`;
        questionTextEl.innerText = `What is the ${currentPropertyKey.toLowerCase()} of ${correctMuscleName}?`;

        // --- Options Generation ---
        let allAnswers = [correctAnswer];
        
        // Find 3 incorrect answers from other muscles' data for the same property
        const incorrectMuscles = muscleData.filter(m => m['Muscle Name'] !== correctMuscleName);
        
        shuffleArray(incorrectMuscles); 

        for (let i = 0; i < 3 && i < incorrectMuscles.length; i++) {
            const incorrectAnswer = incorrectMuscles[i][currentPropertyKey];
            if (!allAnswers.includes(incorrectAnswer)) {
                allAnswers.push(incorrectAnswer);
            }
        }
        
        // Safety check to ensure 4 options exist
        while (allAnswers.length < 4) {
             const paddingMuscle = incorrectMuscles[Math.floor(Math.random() * incorrectMuscles.length)];
             const paddingKey = propertyKeys[Math.floor(Math.random() * propertyKeys.length)];
             const paddingAnswer = paddingMuscle[paddingKey];
             if (!allAnswers.includes(paddingAnswer)) {
                allAnswers.push(paddingAnswer);
            } else {
                // Failsafe in case we can't find 4 unique answers easily (highly unlikely with this data set)
                allAnswers.push(`Option ${allAnswers.length + 1}`);
            }
        }

        shuffleArray(allAnswers);

        allAnswers.forEach(answer => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = answer;
            button.onclick = () => checkAnswer(answer, button);
            optionsContainer.appendChild(button);
        });

        // Update question counter to show current question number (1-indexed)
        if (!isRandomMode) {
            questionCountEl.innerText = (orderedMuscleIndex * propertyKeys.length) + (orderedPropertyIndex + 1);
        } else {
            // In random mode, just show the number of questions answered + 1
            questionCountEl.innerText = questionsAnswered + 1;
        }

        // --- Advance Index for Ordered Mode ---
        if (!isRandomMode) {
            orderedPropertyIndex++;
            if (orderedPropertyIndex >= propertyKeys.length) {
                orderedPropertyIndex = 0;
                orderedMuscleIndex++;
            }
        }
    }

    function checkAnswer(selectedAnswer, selectedButton) {
        // Increment the number of questions *answered*
        // This is separate from the ordered mode's index tracking
        questionsAnswered++;
        
        const isCorrect = selectedAnswer === currentQuestion.correct;
        const buttons = optionsContainer.querySelectorAll('.option-btn');

        buttons.forEach(btn => {
            btn.disabled = true;
            // Highlight the correct answer
            if (btn.innerText === currentQuestion.correct) {
                btn.classList.add('option-correct');
            }
        });

        // Highlight the user's selected answer if wrong
        if (!isCorrect) {
            selectedButton.classList.add('option-wrong');
        }

        // Update score
        if (isCorrect) {
            score++;
        }

        scoreEl.innerText = score;

        // Update question counter display to reflect total answered
        if (isRandomMode) {
            // In random mode, update the Q number only after it's answered
            questionCountEl.innerText = questionsAnswered;
        }

        feedbackEl.style.display = 'block';
        if (isCorrect) {
            feedbackEl.className = 'feedback-area feedback-correct';
            feedbackEl.innerHTML = `<strong>Correct!</strong> Great job.`;
        } else {
            feedbackEl.className = 'feedback-area feedback-wrong';
            feedbackEl.innerHTML = `<strong>Incorrect.</strong><br>The correct answer is: <br><em>${currentQuestion.correct}</em>`;
        }

        // Check if Ordered Mode is complete, otherwise show next button
        if (!isRandomMode && orderedMuscleIndex >= muscleData.length) {
            // End of Ordered Quiz reached
            nextBtn.style.display = 'none';
        } else {
            // Show Next Question button
            nextBtn.style.display = 'block';
        }

        // MANDATORY: Show End Quiz button in BOTH Random AND Ordered mode after a question is answered
        endQuizBtn.style.display = 'block';
    }

    function nextQuestion() {
        // Since the ordered index was already advanced in generateQuestion (before it was called again here),
        // we just call generateQuestion again. The generateQuestion function handles the final check.
        generateQuestion();
    }

    function endQuiz() {
        quizContainer.style.display = 'none';
        resultsContainer.style.display = 'block';
        
        const finalScoreEl = document.getElementById('final-score');
        const percentage = questionsAnswered === 0 ? 0 : Math.round((score / questionsAnswered) * 100);
        
        finalScoreEl.innerText = `${percentage}%`;
        document.getElementById('final-correct').innerText = score;
        document.getElementById('final-total').innerText = questionsAnswered;
    }

</script>

</body>
</html>
